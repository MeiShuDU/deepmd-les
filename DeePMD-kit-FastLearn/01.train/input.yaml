model:
  type: hybrid_ener
  type_map: ["O", "H"]
  descriptor:
    type: se_a
    sel: [46, 92]
    rcut_smth: 0.50
    rcut: 6.00
    neuron: [25, 50, 100]
    axis_neuron: 16
    resnet_dt: false
    seed: 1
  fitting_net:
    neuron: [240, 240, 240]
    resnet_dt: true
    seed: 1
  les_params:
    use_atomwise: true
    sigma: 1.0
    dl: 1.5
    use_fixed_atomic_charges: true
    verbose: true
    log_freq: 100

learning_rate:
  type: exp
  decay_steps: 5000
  start_lr: 0.001
  stop_lr: 3.51e-8

loss:
  type: ener
  start_pref_e: 0.02
  limit_pref_e: 1.0
  start_pref_f: 1000.0
  limit_pref_f: 1.0
  start_pref_v: 0.0
  limit_pref_v: 0.0

training:
  training_data:
    systems: ["../data/data_0/", "../data/data_1", "../data/data_2/"]
    batch_size: auto
  validation_data:
    systems: [../data/data_3]
    batch_size: 1
    numb_btch: 3
  numb_steps: 10000
  seed: 10
  disp_file: "lcurve.out"
  disp_freq: 100
  save_freq: 500
