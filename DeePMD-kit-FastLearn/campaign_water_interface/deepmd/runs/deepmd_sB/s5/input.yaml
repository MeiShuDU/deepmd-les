# deepmd, replicate B, block 5/7 - generated by
# campaign_water_interface/deepmd/gen_inputs.py
# short-range control on cace's schedule (mirrors fit-interface-mp0-sr)
#
# schedule: cace PHASES, block 5 = E weight 0.01 for 40 epochs
# block LR: start_lr 0.01 with decay_steps 9000 / decay_rate 0.5,
#           i.e. cace's StepLR(20, 0.5) on this task's epoch counter
# chain:   run after block 4; --init-model rebuilds the optimiser, which is
#          what cace does at every phase-0 block
#
# precision: float32, and it is NOT set here. deepmd's interface precision comes
#          from the DP_INTERFACE_PREC environment variable, read once at
#          `import deepmd.env` (deepmd/env.py:34-50); there is no input.yaml key
#          for it, and the model-level `precision` key is a different thing (it
#          would pin the embedding-net parameters while leaving the interface and
#          the LES/Ewald path in fp64). Run these configs through run_chain.py,
#          which sets DP_INTERFACE_PREC=low for the child `dp`; a bare
#          `dp --pt train` runs them in deepmd's default float64 instead, which
#          is roughly 1/64 the fp32 rate on this GPU class and would silently
#          break the cost comparison against cace.
model:
  type: standard
  type_map: ["O", "H"]
  data_stat_nbatch: 2
  descriptor:
    type: se_a
    sel: [43, 84]
    rcut_smth: 0.5
    rcut: 6
    neuron: [25, 50, 100]
    axis_neuron: 16
    resnet_dt: false
    seed: 2
  fitting_net:
    neuron: [240, 240, 240]
    seed: 2

learning_rate:
  type: exp
  decay_steps: 9000
  decay_rate: 0.5
  start_lr: 0.01
  stop_lr: 0.0025

loss:
  type: ener
  start_pref_e: 15.66
  limit_pref_e: 15.66
  start_pref_f: 1000
  limit_pref_f: 1000
  start_pref_v: 0.0
  limit_pref_v: 0.0

training:
  training_data:
    systems: ["../../../../data/water-interface/train"]
    batch_size: 1
  validation_data:
    systems: ["../../../../data/water-interface/valid"]
    batch_size: 1
    numb_btch: 50
  numb_steps: 18000
  warmup_steps: 2250
  gradient_max_norm: 10.0
  seed: 20
  disp_file: "lcurve.out"
  disp_freq: 450
  save_freq: 4500
  save_ckpt: "model.ckpt"
  max_ckpt_keep: 40
