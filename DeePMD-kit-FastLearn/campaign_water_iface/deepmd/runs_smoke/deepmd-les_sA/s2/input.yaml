# deepmd-les, replicate A, block 2/8 - generated by
# campaign_water_iface/deepmd/gen_inputs_water.py
# learned per-atom charge + Ewald, on cace's schedule; the charge head is cace's [24, 12]
#
# descriptor / SR head: user-specified for this campaign
# schedule: cace fit-interface mp0 recipe, block 2 = E weight 0.01 for 1 epochs
# block LR: start_lr 0.01 with decay_steps 1 / decay_rate 0.5,
#           i.e. cace's StepLR(20, 0.5) on this task's epoch counter
# chain:   run after block 1; --init-model rebuilds the optimiser and resets
#          the step counter, which is what cace does at every fresh block
model:
  type: hybrid_ener
  type_map: ["O", "H"]
  descriptor:
    type: se_a
    sel: [43, 84]
    rcut_smth: 0.5
    rcut: 6
    neuron: [25, 50, 100]
    axis_neuron: 16
    resnet_dt: false
    seed: 1
  fitting_net:
    neuron: [240, 240, 240]
    activation_function: silu
    resnet_dt: false
    seed: 1
  # les_params: cace fit-interface-mp0's long-range recipe - charge head [24, 12],
  # Ewald dl 2 sigma 1, CombinePotential mixing weight 0.02 -> lr_weight, and
  # remove_self_interaction true as the author's own checkpoints have it. cace's
  # charge head is bias=False with n_out=4 (four independent Ewald channels); les's
  # is a single scalar charge with a bias. See the module docstring.
  les_params:
    sigma: 1.0
    dl: 2.0
    remove_self_interaction: true
    output_scaling_factor: 1.0
    lr_weight: 0.02
    local_charge: true
    n_hidden: [24, 12]
    n_layers: 3
    add_linear_nn: true
    verbose: true
    log_freq: 1000

learning_rate:
  type: exp
  decay_steps: 1
  decay_rate: 0.5
  start_lr: 0.01
  stop_lr: 0.00015625

loss:
  type: ener
  start_pref_e: 15.66
  limit_pref_e: 15.66
  start_pref_f: 1000
  limit_pref_f: 1000
  start_pref_v: 0.0
  limit_pref_v: 0.0

training:
  training_data:
    systems: ["../../../../data/train"]
    batch_size: 1
  validation_data:
    systems: ["../../../../data/valid"]
    batch_size: 1
    numb_btch: 2
  numb_steps: 6
  warmup_steps: 2
  gradient_max_norm: 10.0
  seed: 10
  disp_file: "lcurve.out"
  disp_freq: 3
  save_freq: 6
  save_ckpt: "model.ckpt"
  max_ckpt_keep: 30
