# deepmd, replicate A, block 6/7 - generated by
# campaign_water_iface/deepmd/gen_inputs_water.py
# short-range only control, on cace's schedule
#
# descriptor / SR head: user-specified for this campaign
# schedule: cace fit-interface mp0-sr recipe, block 6 = E weight 1.0 for 100 epochs
# block LR: start_lr 0.0025 with decay_steps 9000 / decay_rate 0.5,
#           i.e. cace's StepLR(20, 0.5) on this task's epoch counter
# chain:   run after block 5; --init-model rebuilds the optimiser and resets
#          the step counter, which is what cace does at every fresh block
model:
  type: standard
  type_map: ["O", "H"]
  descriptor:
    type: se_a
    sel: [43, 84]
    rcut_smth: 0.50
    rcut: 6.00
    neuron: [25, 50, 100]
    axis_neuron: 16
    resnet_dt: false
    seed: 1
  fitting_net:
    neuron: [240, 240, 240]
    activation_function: silu
    resnet_dt: false
    seed: 1

learning_rate:
  type: exp
  decay_steps: 9000
  decay_rate: 0.5
  start_lr: 0.0025
  stop_lr: 7.8125e-05

loss:
  type: ener
  start_pref_e: 1566
  limit_pref_e: 1566
  start_pref_f: 1000
  limit_pref_f: 1000
  start_pref_v: 0.0
  limit_pref_v: 0.0

training:
  training_data:
    systems: ["../../../../data/train"]
    batch_size: 1
  validation_data:
    systems: ["../../../../data/valid"]
    batch_size: 1
    numb_btch: 50
  numb_steps: 45000
  warmup_steps: 0
  gradient_max_norm: 10.0
  seed: 10
  disp_file: "lcurve.out"
  disp_freq: 450
  save_freq: 9000
  save_ckpt: "model.ckpt"
  max_ckpt_keep: 30
