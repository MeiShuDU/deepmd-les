# deepmd-les-cace-sched, replicate A, block 6/8 - generated by
# campaign_fastlearn/deepmd/gen_inputs_sea.py
# learned per-atom charge + Ewald, on cace's SR net and schedule; the charge head is cace's [24, 12] and starts unanchored, as cace's does
#
# SR net:  cace Atomwise [32, 16] silu, without its parallel linear skip
# schedule: cace ENV_PHASES, block 6 = E weight 1.0 for 3 epochs
# block LR: start_lr 0.00125 with decay_steps 160 / decay_rate 0.5,
#           i.e. cace's StepLR(20, 0.5) on this task's epoch counter
# chain:   run after block 5; --init-model rebuilds the optimiser, which is
#          what cace does at every phase-0 block
model:
  type: hybrid_ener
  type_map: ["O", "H"]
  descriptor:
    type: se_a
    sel: [39, 73]
    rcut_smth: 0.50
    rcut: 5.50
    neuron: [25, 50, 100]
    axis_neuron: 16
    resnet_dt: false
    seed: 1
  fitting_net:
    neuron: [32, 16]
    activation_function: silu
    resnet_dt: false
    seed: 1
  # LES block: cace fit-water-timing, knob for knob, plus the two cace knobs the
  # earlier deepmd arms left at les defaults (n_hidden/n_layers = the [24,12] charge
  # head; no initial_guess, matching cace's unanchored init). The Ewald prefactor
  # still differs (cace 1.0 vs les 90.4756) and is absorbed by the free charge net;
  # see gen_inputs.py.
  les_params:
    sigma: 1.0
    dl: 2.0
    remove_self_interaction: false
    output_scaling_factor: 1.0
    lr_weight: 1.0
    local_charge: true
    n_hidden: [24, 12]
    n_layers: 3
    add_linear_nn: true
    verbose: true
    log_freq: 100

learning_rate:
  type: exp
  decay_steps: 160
  decay_rate: 0.5
  start_lr: 0.00125
  stop_lr: 0.00015625

loss:
  type: ener
  start_pref_e: 96
  limit_pref_e: 96
  start_pref_f: 1000
  limit_pref_f: 1000
  start_pref_v: 0.0
  limit_pref_v: 0.0

training:
  training_data:
    systems: ["../../../../../data/data_0", "../../../../../data/data_1", "../../../../../data/data_2"]
    batch_size: 2
  validation_data:
    systems: ["../../../../../data/data_3"]
    batch_size: 4
    numb_btch: 20
  numb_steps: 480
  warmup_steps: 0
  gradient_max_norm: 10.0
  seed: 10
  disp_file: "lcurve.out"
  disp_freq: 10
  save_freq: 160
  save_ckpt: "model.ckpt"
  max_ckpt_keep: 30
