# deepmd-cace-sched, replicate A, block 3/8 - generated by
# campaign_fastlearn/deepmd/gen_inputs_sea.py
# short-range only control, on cace's SR net and cace's schedule
#
# SR net:  cace Atomwise [32, 16] silu, without its parallel linear skip
# schedule: cace ENV_PHASES, block 3 = E weight 0.1 for 3 epochs
# block LR: start_lr 0.01 with decay_steps 160 / decay_rate 0.5,
#           i.e. cace's StepLR(20, 0.5) on this task's epoch counter
# chain:   run after block 2; --init-model rebuilds the optimiser, which is
#          what cace does at every phase-0 block
model:
  type: standard
  type_map: ["O", "H"]
  descriptor:
    type: se_a
    sel: [39, 73]
    rcut_smth: 0.50
    rcut: 5.50
    neuron: [25, 50, 100]
    axis_neuron: 16
    resnet_dt: false
    seed: 1
  fitting_net:
    neuron: [32, 16]
    activation_function: silu
    resnet_dt: false
    seed: 1

learning_rate:
  type: exp
  decay_steps: 160
  decay_rate: 0.5
  start_lr: 0.01
  stop_lr: 0.00125

loss:
  type: ener
  start_pref_e: 9.6
  limit_pref_e: 9.6
  start_pref_f: 1000
  limit_pref_f: 1000
  start_pref_v: 0.0
  limit_pref_v: 0.0

training:
  training_data:
    systems: ["../../../../../data/data_0", "../../../../../data/data_1", "../../../../../data/data_2"]
    batch_size: 2
  validation_data:
    systems: ["../../../../../data/data_3"]
    batch_size: 4
    numb_btch: 20
  numb_steps: 480
  warmup_steps: 5
  gradient_max_norm: 10.0
  seed: 10
  disp_file: "lcurve.out"
  disp_freq: 10
  save_freq: 160
  save_ckpt: "model.ckpt"
  max_ckpt_keep: 30
