# deepmd, replicate B - generated by campaign_fastlearn/deepmd/gen_inputs.py
# short-range only control: identical SR network, no long-range term
#
# SR network: 01.train/rerun/gen_extended.py (rcut 6.00 -> 5.50, sel follows rcut)
# LR block:   cace-lr-fit-datarepo/.../fit-water-timing/n/a (no long range)
# steps:      80000 = 500 epochs of 160 steps
model:
  type: standard
  type_map: ["O", "H"]
  descriptor:
    type: se_a
    sel: [39, 73]
    rcut_smth: 0.50
    rcut: 5.50
    neuron: [25, 50, 100]
    axis_neuron: 16
    resnet_dt: false
    seed: 2
  fitting_net:
    neuron: [240, 240, 240]
    resnet_dt: true
    seed: 2

learning_rate:
  type: exp
  decay_steps: 5000
  start_lr: 0.001
  stop_lr: 3.51e-8

loss:
  type: ener
  start_pref_e: 0.02
  limit_pref_e: 1.0
  start_pref_f: 1000.0
  limit_pref_f: 1.0
  start_pref_v: 0.0
  limit_pref_v: 0.0

training:
  training_data:
    systems: ["../../../../data/data_0", "../../../../data/data_1", "../../../../data/data_2"]
    batch_size: 2
  validation_data:
    systems: ["../../../../data/data_3"]
    batch_size: 1
    numb_btch: 3
  numb_steps: 80000
  seed: 20
  disp_file: "lcurve.out"
  disp_freq: 1000
  save_freq: 10000
  save_ckpt: "model.ckpt"
  max_ckpt_keep: 5
