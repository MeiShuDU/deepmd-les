# EXTENSION 80000 -> 120000 - generated by gen_extend_inputs.py from input.yaml.
# Launch with:  ./run_extend.sh --from 80000 --to 120000
#   or:  dp --pt train input_120k.yaml --restart <abs>/model.ckpt-80000.pt
# --restart keeps the global step, so the 24-level staircase resumes at
# 1.07e-06 - 16x the 6.66e-08 the 80k run ended on - and
# anneals through 8 more levels to 5.38e-08. (A run never quite reaches the
# nominal stop_lr 3.51e-08: it applies levels 0..N/ds-1 only.) Everything else is
# byte-identical to input.yaml.
# deepmd-les-freeze-charge, replicate A - generated by campaign_fastlearn/deepmd/gen_inputs.py
# SPC/E charges held fixed: the long-range term is a classical Ewald with no learnable charge and no initial_guess
#
# SR network: 01.train/rerun/gen_extended.py (rcut 6.00 -> 5.50, sel follows rcut)
# LR block:   cace-lr-fit-datarepo/.../fit-water-timing/fit_cace_new.py
# steps:      80000 = 500 epochs of 160 steps
model:
  type: hybrid_ener
  type_map: ["O", "H"]
  descriptor:
    type: se_a
    sel: [39, 73]
    rcut_smth: 0.50
    rcut: 5.50
    neuron: [25, 50, 100]
    axis_neuron: 16
    resnet_dt: false
    seed: 1
  fitting_net:
    neuron: [240, 240, 240]
    resnet_dt: true
    seed: 1
  # LES block: cace fit-water-timing, knob for knob, except the
  # Ewald prefactor: cace uses norm_factor 1.0 (charges scaled by
  # sqrt(1/(2 eps_0)) ~ 9.49) and les hardcodes the physical
  # 90.4756. Not reachable from les_params; see gen_inputs.py.
  les_params:
    freeze_charge: [-0.8476, 0.4238]
    sigma: 1.0
    dl: 2.0
    remove_self_interaction: false
    lr_weight: 1.0
    verbose: true
    log_freq: 100

learning_rate:
  type: exp
  decay_steps: 5000
  start_lr: 0.001
  stop_lr: 3.51e-8

loss:
  type: ener
  start_pref_e: 0.02
  limit_pref_e: 1.0
  start_pref_f: 1000.0
  limit_pref_f: 1.0
  start_pref_v: 0.0
  limit_pref_v: 0.0

training:
  training_data:
    systems: ["../../../../data/data_0", "../../../../data/data_1", "../../../../data/data_2"]
    batch_size: 2
  validation_data:
    systems: ["../../../../data/data_3"]
    batch_size: 1
    numb_btch: 3
  numb_steps: 120000
  seed: 10
  disp_file: "lcurve.out"
  disp_freq: 1000
  save_freq: 10000
  save_ckpt: "model.ckpt"
  max_ckpt_keep: 11